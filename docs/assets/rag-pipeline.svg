<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">RAG: To faser, to modeller</title><desc id="desc">Indeksering: dokumenter deles i chunks og bliver til embeddings i RAM. Spørgsmål embeds med samme model og sammenlignes med indekset. De bedste kilder sendes med spørgsmålet til chatmodellen, der skriver et svar.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="720" rx="20" fill="#f8fafc"/><text x="42" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#0f172a" font-weight="700">RAG · To faser, to modeller</text><text x="42" y="86" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#475569" font-weight="400">Dokumenterne giver kontekst. Modellens vægte ændres ikke.</text><text x="42" y="137" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1d4ed8" font-weight="700">01  INDEKSERING · ÉN GANG VED OPSTART</text><rect x="42" y="160" width="237" height="86" rx="13" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="60" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Dokumenter</text><text x="60" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">UTF-8 .txt-filer</text><rect x="335" y="160" width="237" height="86" rx="13" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="353" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Tekststykker</text><text x="353" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">100 ord · 20 ord overlap</text><rect x="628" y="160" width="237" height="86" rx="13" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="646" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Embeddingmodel</text><text x="646" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">embeddinggemma</text><rect x="921" y="160" width="237" height="86" rx="13" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="939" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Indeks i RAM</text><text x="939" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">Vektorer + kilder</text><path d="M279 203 H327" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M572 203 H620" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M865 203 H913" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="42" y="326" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#6d28d9" font-weight="700">02  SPØRGSMÅL · GENTAGES FOR HVER TUR</text><rect x="42" y="350" width="237" height="86" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="60" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Dit spørgsmål</text><text x="60" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">Hvornår er fristen?</text><rect x="335" y="350" width="237" height="86" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="353" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Embeddingmodel</text><text x="353" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">Samme model som før</text><rect x="628" y="350" width="237" height="86" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="646" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Sammenligning</text><text x="646" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">Cosinuslighed · top-k = 2</text><rect x="921" y="350" width="237" height="86" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="939" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Fundne kilder</text><text x="939" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">Tekst med kildeetiketter</text><path d="M279 393 H327" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M572 393 H620" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M865 393 H913" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1039 246 V280 H746 V340" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="628" y="526" width="237" height="86" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="646" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Chatmodel</text><text x="646" y="589" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">llama3.2:3b</text><rect x="921" y="526" width="237" height="86" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="939" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">Svar med kilder</text><text x="939" y="589" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155" font-weight="400">Kontrollér påstandene</text><path d="M1039 436 V479 H746 V516" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="735" y="469" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#475569" font-weight="400">Spørgsmål + kilder</text><path d="M865 569 H913" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="42" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#0f172a" font-weight="700">FIND → GIV KONTEKST → SVAR</text><text x="42" y="580" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#475569" font-weight="400">Embeddingmodellen søger.</text><text x="42" y="609" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#475569" font-weight="400">Chatmodellen formulerer.</text><rect x="42" y="653" width="1116" height="42" rx="10" fill="#fef3c7"/><text x="60" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#78350f" font-weight="400">Husk: Lighed er ikke sikkerhed. Modellen kan stadig tage fejl eller citere forkert.</text></svg>